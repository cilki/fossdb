[package]
name = "fossdb-server"
description = "FossDB server"
version.workspace = true
edition.workspace = true
authors = ["cilki"]
repository = "https://github.com/fossable/fossdb/"
license = "Unlicense"


[lib]
crate-type = ["cdylib", "rlib"]

# The binary is an API server; without that feature there is nothing to run.
[[bin]]
name = "fossdb-server"
path = "src/main.rs"
required-features = ["api-server"]

[features]
default = ["api-server"]
db = ["dep:native_db", "dep:native_model", "dep:once_cell"]
api-server = [
  "db",
  "dep:tokio",
  "dep:axum",
  "dep:tower",
  "dep:tower-http",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:dotenvy",
  "dep:tokio-util",
  "dep:getrandom",
  "dep:sha2",
  "dep:atom_syndication",
  "dep:rss",
]

[dependencies]
# Workspace dependencies
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
serde_json.workspace = true
serde.workspace = true

# Core types
fossdb = { path = "../fossdb", version = "0.0.1" }

# Server dependencies
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
regex = "1.0"
semver = "1.0"
tokio = { version = "1.0", features = ["full"], optional = true }

# API server dependencies
axum = { version = "0.8.9", features = ["ws"], optional = true }
tower = { version = "0.5.3", optional = true }
tower-http = { version = "0.7.1", features = ["cors", "fs"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
dotenvy = { version = "0.15", optional = true }
tokio-util = { version = "0.7", optional = true }

# Account credentials and API keys are drawn straight from the OS CSPRNG.
getrandom = { version = "0.4", optional = true }

# API key secrets are stored hashed. A plain digest is sufficient: the secret
# is 128 bits from a CSPRNG, so there is no dictionary to stretch against.
sha2 = { version = "0.11", optional = true }

# Feed serialisation. Package names and descriptions originate from third
# party registries and flow verbatim into the feed, so XML escaping is
# delegated to these rather than hand-rolled.
atom_syndication = { version = "0.12", optional = true }
rss = { version = "2.0", optional = true }

once_cell = { version = "1.19", optional = true }

# Database dependencies
native_db = { version = "0.8.2", optional = true }
native_model = { version = "0.4.20", optional = true }

[dev-dependencies]
tempfile = "3"
