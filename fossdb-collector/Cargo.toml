[package]
name = "fossdb-collector"
description = "FossDB package collector"
version.workspace = true
edition.workspace = true
authors = ["cilki"]
repository = "https://github.com/fossable/fossdb/"
license = "Unlicense"

[features]
default = ["collector-rust", "collector-nixpkgs", "collector-osv"]
collector-rust = ["dep:crates_io_api"]
collector-nixpkgs = []
collector-libraries-io = []
# Security advisories from osv.dev for the ecosystems in OSV_ECOSYSTEMS
# (default crates.io).
collector-osv = ["dep:zip", "dep:semver"]

[dependencies]
# Workspace dependencies
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

# Core types
fossdb = { path = "../fossdb", version = "0.0.1" }

async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive", "env"] }

# Rust collector
crates_io_api = { version = "0.12", default-features = false, features = ["rustls"], optional = true }

# OSV collector
semver = { version = "1.0", optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
