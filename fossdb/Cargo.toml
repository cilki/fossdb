[package]
name = "fossdb"
version.workspace = true
edition.workspace = true

# Shared wire types only. Kept dependency-free enough to compile to wasm32 for
# fossdb-web; the CLI lives in fossdb-cli so that clap and an HTTP stack never
# enter this crate's graph.

[dependencies]
chrono.workspace = true
percent-encoding = "2.3"
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
